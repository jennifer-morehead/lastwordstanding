<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" type="text/css" href="splash/splash.css" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, width=device-width, height=device-height, user-scalable=0"
    />
    <title>devvit</title>
  </head>
  <body class="app">
    <div class="app-container">
      <div class="splash-header">
        <img
          src="logo_splash.png"
          alt="Last Word Standing"
          class="splash-logo"
        />
      </div>

      <div class="splash-body">
        <p class="splash-subtitle">Chain words. Beat the clock.</p>
        <button class="start-button" id="start-button">Play</button>
        <div class="post-rule-stack" id="post-rule-stack" hidden>
          <div class="post-number-label" id="post-number-label"></div>
          <div class="post-rule-label" id="post-rule-label"></div>
        </div>

        <div class="top-players-preview">
          <div class="top-players-heading">
            <span>Today’s leaders</span>
            <span>Points</span>
          </div>
          <div id="top-players" class="top-players-list is-loading">
            <div class="top-player-placeholder">Loading top players…</div>
          </div>
        </div>
      </div>
      <script type="module" src="splash/splash.ts" defer></script>
    </div>
  </body>
</html>
